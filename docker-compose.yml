services:
  ss-zapret2:
    image: vernette/ss-zapret2:v1.0.2
    build: .
    container_name: zapret2-proxy
    restart: unless-stopped
    environment:
      - GOST_COMMAND="-L=:8888"
      - GOST_VERBOSE=${GOST_VERBOSE:-0}
    ports:
      - "127.0.0.1:8888:8888/tcp"
      - "127.0.0.1:8888:8888/udp"
    volumes:
      - ./config:/opt/zapret2/config
      - ./lua:/opt/zapret2/lua
      - ./fakes:/opt/zapret2/files/fake
      - ./scripts/examples:/opt/zapret2/init.d/custom.d.examples.linux
      - ./scripts/custom.d:/opt/zapret2/init.d/sysv/custom.d
    healthcheck:
      test: [
        "CMD-SHELL",
        "nc -z localhost 8888 || exit 1"
      ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 3s
    cap_add:
      - NET_ADMIN
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
